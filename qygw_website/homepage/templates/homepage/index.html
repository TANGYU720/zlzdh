<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }
        a {
            color: white;
            text-decoration: none;
        }
        .hero {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .feature {
            text-align: center;
            padding: 2rem;
            border: 1px solid #eee;
            border-radius: 10px;
        }
        .feature h3 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">企业名称</div>
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">关于我们</a></li>
                <li><a href="#">产品服务</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
        </nav>
    </header>
    
    <section class="hero">
        <h1>欢迎来到我们的企业</h1>
        <p>专业的服务，卓越的品质</p>
        <a href="#" class="btn">了解更多</a>
    </section>
    
    <section class="features">
        <div class="feature">
            <h3>专业团队</h3>
            <p>我们拥有一支经验丰富、专业素质高的团队，为您提供最优质的服务。</p>
        </div>
        <div class="feature">
            <h3>创新技术</h3>
            <p>采用最新的技术和理念，不断创新，为客户创造更大价值。</p>
        </div>
        <div class="feature">
            <h3>优质服务</h3>
            <p>以客户为中心，提供全方位的优质服务，满足您的各种需求。</p>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2024 企业名称. 保留所有权利.</p>
    </footer>
</body>
</html>
